<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bar-container" id="bar-container">
    <div class="drag-handle" title="Drag to move">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="6" r="1.5" fill="currentColor"></circle>
        <circle cx="15" cy="6" r="1.5" fill="currentColor"></circle>
        <circle cx="9" cy="12" r="1.5" fill="currentColor"></circle>
        <circle cx="15" cy="12" r="1.5" fill="currentColor"></circle>
        <circle cx="9" cy="18" r="1.5" fill="currentColor"></circle>
        <circle cx="15" cy="18" r="1.5" fill="currentColor"></circle>
      </svg>
    </div>

    <input 
      type="text" 
      id="command-input" 
      placeholder="Tell me what to do" 
      autocomplete="off" 
      spellcheck="false" 
      autofocus
    />

    <div class="action-badge" id="action-badge">
      <span id="badge-text">⏎</span>
    </div>
  </div>

  <!-- Subtle slide-down result strip -->
  <div class="result-strip hidden" id="result-strip">
    <span class="result-text" id="result-text"></span>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
