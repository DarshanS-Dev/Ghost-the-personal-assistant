<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="palette-container">
    <!-- Header / Input -->
    <div class="search-bar">
      <input 
        type="text" 
        id="command-input" 
        placeholder="Type a command or search" 
        autocomplete="off" 
        spellcheck="false" 
        autofocus
      />
      <span class="shortcut-tag">Ctrl K</span>
    </div>

    <!-- Active / Dynamic Action Item (New task) -->
    <div class="action-item selected" id="action-new-task" data-index="0">
      <div class="item-left">
        <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="item-title" id="action-title">New task</span>
      </div>
      <div class="item-right">
        <span class="key-hint" id="action-hint">Tab+N / N</span>
      </div>
    </div>

    <!-- Navigation Section -->
    <div class="section-label">Navigation</div>

    <div class="items-list" id="items-list">
      <!-- Item: Task -->
      <div class="nav-item" data-index="1">
        <div class="item-left">
          <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          <span class="item-title">Task</span>
        </div>
        <div class="item-right"></div>
      </div>

      <!-- Item: Calendar -->
      <div class="nav-item" data-index="2">
        <div class="item-left">
          <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="item-title">Calendar</span>
        </div>
        <div class="item-right"></div>
      </div>

      <!-- Item: Eisenhower Matrix -->
      <div class="nav-item" data-index="3">
        <div class="item-left">
          <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
          <span class="item-title">Eisenhower Matrix</span>
        </div>
        <div class="item-right"></div>
      </div>

      <!-- Item: Habit -->
      <div class="nav-item" data-index="4">
        <div class="item-left">
          <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="item-title">Habit</span>
        </div>
        <div class="item-right"></div>
      </div>

      <!-- Item: Search -->
      <div class="nav-item" data-index="5">
        <div class="item-left">
          <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span class="item-title">Search</span>
        </div>
        <div class="item-right">
          <span class="key-hint">/</span>
        </div>
      </div>

      <!-- Item: Go to Settings -->
      <div class="nav-item" data-index="6">
        <div class="item-left">
          <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l7.5 4.5v9L12 20l-7.5-4.5v-9L12 2z"></path>
            <circle cx="12" cy="11" r="3"></circle>
          </svg>
          <span class="item-title">Go to Settings</span>
        </div>
        <div class="item-right">
          <span class="key-hint">G then S</span>
        </div>
      </div>

      <!-- Item: Go to All -->
      <div class="nav-item" data-index="7">
        <div class="item-left">
          <svg class="item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 12h-6l-2 3h-4l-2-3H2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-7z"></path>
            <path d="M5.45 5.11L2 12v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-7l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
          </svg>
          <span class="item-title">Go to All</span>
        </div>
        <div class="item-right">
          <span class="key-hint">G then A</span>
        </div>
      </div>
    </div>

    <!-- Status Strip / Progress -->
    <div class="status-strip" id="status-strip">
      <span class="status-text" id="status-text">Ready</span>
      <span class="status-tip">Esc to close</span>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
